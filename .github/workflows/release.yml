name: Desktop release

on:
  workflow_dispatch:
    inputs:
      scoresway_url:
        description: Optional current Scoresway match URL for live and batch acceptance
        type: string
      whoscored_url:
        description: Optional current WhoScored match URL (runner may be blocked by provider)
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  acceptance:
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    # The Windows installer is signed for in-app updates during acceptance.
    secrets: inherit
    with:
      scoresway_url: ${{ inputs.scoresway_url || '' }}
      whoscored_url: ${{ inputs.whoscored_url || '' }}

  # The Mac disk images are built and tested by their own workflows; the exact tested
  # bytes are attached to the release with the other packages.
  mac-dmg:
    permissions:
      contents: read
    uses: ./.github/workflows/mac-dmg.yml
    secrets: inherit

  # Still being tested: if the Intel image fails, the release goes ahead without it
  # (the candidate summary says which images are included).
  mac-dmg-intel:
    permissions:
      contents: read
    uses: ./.github/workflows/mac-dmg-intel.yml
    secrets: inherit

  candidate:
    needs: [acceptance, mac-dmg, mac-dmg-intel]
    if: ${{ !cancelled() && needs.acceptance.result == 'success' && needs.mac-dmg.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-package-*
          path: tested-packages
          merge-multiple: true
      - name: Assemble only exact tested packages, formulas, manifests and checksums
        run: python packaging/release_candidate.py assemble --input tested-packages --output release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: VizorPlay-1.0.0-candidate
          path: release-artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Candidate summary
        run: |
          echo 'Candidate contains the exact tested NSIS, DEB, Apple Silicon disk image and Homebrew source archive, SHA256SUMS, acceptance receipts and prepared distribution manifests. No rebuild or publication occurs in this job.' >> "$GITHUB_STEP_SUMMARY"
          if ls release-artifacts/*_x64.dmg >/dev/null 2>&1; then
            echo 'The Intel disk image passed its tests and is included.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The Intel disk image did not pass or did not run, so it is NOT included. Intel Macs use Homebrew until it is.' >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    if: github.ref == 'refs/tags/v1.0.0'
    needs: candidate
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VizorPlay-1.0.0-candidate
          path: release-artifacts
      - name: Verify candidate checksums before publication
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.exe
            release-artifacts/*.deb
            release-artifacts/*.dmg
            release-artifacts/*-source.tar.gz
            release-artifacts/vizorplay.rb
            release-artifacts/B4L1.VizorPlay*.yaml
            release-artifacts/latest.json
            release-artifacts/SHA256SUMS
            release-artifacts/candidate-manifest.json
            release-artifacts/receipt-*.json
            release-artifacts/INSTALL.md
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Installed copies read their update feed from the Latest release. VizorPlay's
          # v1.0.0 tag sorts below ClipMaker's old v1.2, so mark it Latest explicitly.
          make_latest: 'true'
